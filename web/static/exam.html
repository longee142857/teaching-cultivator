<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>周卷</title>
  <link rel="stylesheet" href="/static/katex/katex.min.css" />
  <style>
    :root {
      --bg: #F4EDE0; --card: #F8F2E3; --ink: #2B2118; --muted: rgba(43,33,24,.62);
      --line: rgba(43,33,24,.22); --accent: #3A6B7C; --danger: #A0432F;
      --font-display: "Source Serif 4", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink); line-height: 1.75; min-height: 100vh;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }
    header h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0 0 6px; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
    .status { padding: 12px 14px; border-radius: 10px; background: #fff; border: 1px solid var(--line); margin-bottom: 16px; }
    .status.err { border-color: #f0c2c2; color: var(--danger); background: #fff5f5; }
    .q { background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 16px; margin: 0 0 16px; }
    .q h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .q .body { overflow-x: auto; }
    .q .body p { margin: 0.55em 0; white-space: pre-wrap; }
    .q .body .katex-display { margin: 0.85em 0; overflow-x: auto; overflow-y: hidden; }
    textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
    label.ans { display: block; margin-top: 12px; color: var(--muted); font-size: 0.88rem; }
    .actions { position: sticky; bottom: 0; padding: 12px 0 8px; background: linear-gradient(180deg, transparent, var(--bg) 35%); }
    .action-row { display: flex; gap: 8px; align-items: stretch; }
    .action-row button { width: auto; flex: 1; }
    button { appearance: none; border: 0; border-radius: 2px; background: var(--accent); color: #F4EDE0; font: inherit; font-weight: 600; padding: 12px 22px; width: 100%; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #ocrFab {
      position: static; z-index: auto; right: auto; bottom: auto;
      background: transparent; color: var(--ink); border: 1px solid var(--line);
      box-shadow: none; border-radius: 2px; padding: 12px 16px;
    }
    body.is-sealed #questions,
    body.is-sealed #head { opacity: 0.38; filter: grayscale(0.4); }
    .seal {
      position: fixed; inset: 0; z-index: 25; display: grid; place-items: center;
      pointer-events: none;
    }
    .seal[hidden] { display: none !important; }
    .seal span {
      font-family: var(--font-display); font-size: 7.5rem; line-height: 1;
      color: rgba(160, 67, 47, 0.78);
      border: 6px solid currentColor; border-radius: 6px;
      padding: 0.05em 0.22em; transform: rotate(-16deg);
    }
    #gradeFab {
      position: fixed; z-index: 36;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 52px; height: 52px; padding: 0; border-radius: 50%;
      font-size: 0.92rem; box-shadow: 0 8px 20px rgba(43, 33, 24, 0.18);
    }
    #gradeFab[hidden] { display: none !important; }
    .grade-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: flex-end; justify-content: center;
      background: rgba(28, 26, 22, 0.4);
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .grade-sheet.is-open { display: flex; }
    .grade-card {
      width: min(640px, 100%); max-height: min(80vh, 720px); overflow: auto;
      background: var(--card); border: 1px solid var(--line); border-radius: 2px; padding: 14px;
    }
    .grade-card pre { white-space: pre-wrap; font: inherit; margin: 0 0 12px; }
    .report { margin-top: 20px; padding: 16px; border-radius: 12px; background: #fff; border: 1px solid var(--line); white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    #ocrFab[hidden] { display: none !important; }
    .ocr-sheet.is-open ~ #ocrFab { visibility: hidden; pointer-events: none; }
    .ocr-sheet {
      position: fixed; inset: 0; z-index: 40;
      display: none; align-items: flex-end; justify-content: center;
      background: rgba(28, 26, 22, 0.4);
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .ocr-sheet.is-open { display: flex; }
    .ocr-card {
      width: min(640px, 100%); max-height: min(92vh, 860px);
      overflow: auto; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    .ocr-card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .ocr-target { display: grid; gap: 4px; margin: 8px 0; color: var(--muted); font-size: 0.85rem; }
    .ocr-target select {
      font: inherit; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; color: var(--ink);
    }
    .ocr-modes { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .ocr-mode {
      appearance: none; border: 1px solid var(--line); background: #fff;
      color: var(--ink); border-radius: 999px; padding: 6px 12px;
      font: inherit; font-size: 0.85rem; cursor: pointer; width: auto;
    }
    .ocr-mode.is-on { border-color: var(--accent); background: #e7f5ef; color: var(--accent); font-weight: 600; }
    .ocr-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    .ocr-actions button { width: 100%; border-radius: 10px; padding: 10px 12px; }
    .ocr-actions .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .ocr-preview {
      display: flex; gap: 10px; align-items: center;
      border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
      margin-top: 8px; background: #fff;
    }
    .ocr-preview img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 6px;
      flex-shrink: 0; border: 1px solid var(--line); background: #fff;
    }
    .ocr-meta { font-size: 0.82rem; color: var(--muted); line-height: 1.55; min-width: 0; }
    .ocr-meta strong { display: block; color: var(--ink); font-weight: 600; font-size: 0.88rem; }
    .ocr-src-lab, .ocr-render-lab {
      display: block; margin: 12px 0 6px; color: var(--muted); font-size: 0.85rem;
    }
    #ocrSource {
      width: 100%; min-height: 120px; resize: vertical;
      border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font: inherit; background: #fff;
    }
    .ocr-render {
      min-height: 72px; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; overflow-x: auto;
    }
    .ocr-render.is-empty { color: var(--muted); font-size: 0.85rem; }
    .ocr-render .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }
    .ocr-msg { color: var(--muted); font-size: 0.85rem; margin: 6px 0 0; }
    .ocr-msg.err { color: var(--danger); }
    .ocr-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .ocr-foot button { width: 100%; border-radius: 10px; padding: 10px 12px; }
    .ocr-foot .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="boot" class="status">加载试卷中…</div>
    <div id="gate" class="status" hidden>
      <label for="uidInput" style="display:block;margin-bottom:8px;font-weight:600;">输入口令进入这份卷</label>
      <div style="display:flex;gap:10px;">
        <input id="uidInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="24"
               placeholder="老师私发的一串数字" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font:inherit;" />
        <button type="button" id="uidBtn" style="width:auto;padding:10px 20px;">进入</button>
      </div>
      <p class="hint">口令对应你的作答记录。没交卷会接着上次的草稿纸；交过的卷会封存，只能看批改。</p>
    </div>
    <div id="draftNote" class="status" hidden>
      已恢复上次作答草稿
      <button type="button" id="restartBtn" style="width:auto;padding:6px 14px;margin-left:8px;">重新开始</button>
    </div>
    <header id="head" hidden>
      <h1 id="title">双周检测卷</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div id="questions"></div>
    <div class="actions" id="actions" hidden>
      <div class="action-row">
        <button type="button" id="ocrFab" hidden>手写识别</button>
        <button type="button" id="submitBtn">提交答卷</button>
      </div>
      <p class="hint" id="timeLeft"></p>
      <p class="hint">作答会自动保存草稿。手写识别和提交在同一行，核对后再交。截止前未交的卷可以接着写。</p>
    </div>
    <div id="report" class="report" hidden></div>
  </div>

  <div class="ocr-sheet" id="ocrSheet" aria-hidden="true">
    <div class="ocr-card" role="dialog" aria-modal="true" aria-labelledby="ocrTitle">
      <h3 id="ocrTitle">手写识别</h3>
      <p class="hint" style="margin:0">选图识别后先核对源码和公式预览，再填入指定题（可改）。演算纸用「整页识别」，单条公式用「公式加强」。</p>
      <label class="ocr-target">填入题目
        <select id="ocrTarget"></select>
      </label>
      <div class="ocr-modes">
        <button type="button" class="ocr-mode is-on" data-ocr-mode="document">整页识别</button>
        <button type="button" class="ocr-mode" data-ocr-mode="formula">公式加强</button>
      </div>
      <input type="file" id="ocrFile" accept="image/*" hidden />
      <div class="ocr-actions">
        <button type="button" class="ghost" id="ocrPick">选择手写图片</button>
        <button type="button" id="ocrRun" disabled>识别</button>
      </div>
      <div class="ocr-preview" id="ocrPreview" hidden>
        <img id="ocrPreviewImg" alt="手写预览" />
        <div class="ocr-meta">
          <strong id="ocrFileName">手写图片</strong>
          <span id="ocrMetaHint">点「识别」生成源码。</span>
        </div>
      </div>
      <label class="ocr-src-lab" for="ocrSource">识别源码（可改）</label>
      <textarea id="ocrSource" placeholder="识别结果会出现在这里，也可手改 LaTeX / Markdown。"></textarea>
      <div class="ocr-render-lab">预览</div>
      <div class="ocr-render is-empty" id="ocrRender" aria-live="polite">识别或粘贴源码后，这里显示公式渲染。填入仍用上方源码，不是预览 HTML。</div>
      <p class="ocr-msg" id="ocrMsg"></p>
      <div class="ocr-foot">
        <button type="button" class="ghost" id="ocrClose">关闭</button>
        <button type="button" id="ocrApply" disabled>填入本题</button>
      </div>
    </div>
  </div>
  <div class="seal" id="seal" hidden><span>封</span></div>
  <button type="button" id="gradeFab" hidden aria-label="周卷批改记录">批</button>
  <div class="grade-sheet" id="gradeSheet" aria-hidden="true">
    <div class="grade-card" role="dialog" aria-modal="true" aria-labelledby="gradeTitle">
      <h3 id="gradeTitle">周卷批改记录</h3>
      <pre id="gradeBody"></pre>
      <button type="button" id="gradeClose">关闭</button>
    </div>
  </div>
  <script>
(function () {
  const boot = document.getElementById("boot");
  const head = document.getElementById("head");
  const titleEl = document.getElementById("title");
  const metaEl = document.getElementById("meta");
  const qRoot = document.getElementById("questions");
  const actions = document.getElementById("actions");
  const submitBtn = document.getElementById("submitBtn");
  const reportEl = document.getElementById("report");
  const I18N = {
    title: '双周检测卷',
    bad: '链接无效：缺少 token',
    metaId: '试卷 ID：',
    metaSubj: '· 科目：',
    metaQ: '题',
    metaExp: '· 链接有效至 ',
    qPrefix: '第 ',
    qSuffix: ' 题',
    zone: '作答区 ',
    placeholder: '在此填写本题答案（可用 LaTeX）',
    submit: '提交答卷',
    submitting: '提交中…',
    submitted: '已提交',
    submitConfirm: '确认提交答卷？提交后封存，只能看批改。',
    katexFail: '公式引擎 KaTeX 加载失败',
  };
  function tokenFromPath() {
    const parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
    const i = parts.indexOf("e");
    if (i < 0 || !parts[i + 1]) return "";
    return parts[i + 1];
  }
  const TOKEN = tokenFromPath();
  if (!TOKEN) { boot.className = "status err"; boot.textContent = I18N.bad; return; }

  let UID = "";
  const gate = document.getElementById("gate");
  const uidInput = document.getElementById("uidInput");
  const uidBtn = document.getElementById("uidBtn");
  const draftNote = document.getElementById("draftNote");

  function collectAnswers() {
    const answers = {};
    qRoot.querySelectorAll("textarea[data-i]").forEach(function (ta) {
      answers[ta.dataset.i] = ta.value;
    });
    return answers;
  }

  let _saveTimer = null;
  function wireAutosave() {
    qRoot.addEventListener("input", function () {
      if (_saveTimer) clearTimeout(_saveTimer);
      _saveTimer = setTimeout(saveDraftNow, 1500);
    });
  }

  async function saveDraftNow() {
    if (!UID || document.body.classList.contains("is-sealed")) return;
    try {
      await fetch("/e/" + TOKEN + "/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid: UID, answers: collectAnswers() }),
      });
    } catch (e) {}
  }

  async function restoreDraft() {
    if (!UID) return false;
    let restored = false;
    try {
      const r = await fetch("/e/" + TOKEN + "/draft?uid=" + encodeURIComponent(UID), { cache: "no-store" });
      const data = await r.json();
      if (data && data.ok && data.answers) {
        const map = data.answers;
        qRoot.querySelectorAll("textarea[data-i]").forEach(function (ta) {
          const v = map[ta.dataset.i];
          if (v != null && String(v).trim() !== "") { ta.value = v; restored = true; }
        });
      }
    } catch (e) {}
    return restored;
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("script " + src)); };
      document.head.appendChild(s);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderMathMarkdown(src) {
    const placeholders = [];
    function stash(tex, display) {
      const i = placeholders.length;
      placeholders.push({ tex: tex, display: display });
      return "@@MATH" + i + "@@";
    }
    let text = String(src || "");
    // display: $$...$$ including multiline
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
      return stash(String(tex).trim(), true);
    });
    // inline: $...$ (no newlines; avoid $$ leftovers)
    text = text.replace(/\$([^\$\n]+?)\$/g, function (_, tex) {
      return stash(String(tex).trim(), false);
    });
    let html = escapeHtml(text);
    html = html.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
    html = html.replace(/^##\s+(.+)$/gm, "<h2>$1</h2>");
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\n{2,}/g, "</p><p>");
    html = "<p>" + html + "</p>";
    html = html.replace(/@@MATH(\d+)@@/g, function (_, idx) {
      const item = placeholders[Number(idx)];
      if (!item || typeof katex === "undefined") {
        return "<code>" + escapeHtml(item ? item.tex : "") + "</code>";
      }
      try {
        return katex.renderToString(item.tex, {
          displayMode: !!item.display,
          throwOnError: false,
          strict: "ignore",
          trust: false,
        });
      } catch (e) {
        return "<code>" + escapeHtml(item.tex) + "</code>";
      }
    });
    return html;
  }

  let ocrTargetI = null;
  let ocrMode = "document";
  let ocrPayload = null;
  let ocrBusy = false;
  const ocrSheet = document.getElementById("ocrSheet");
  const ocrMsg = document.getElementById("ocrMsg");
  const ocrFile = document.getElementById("ocrFile");
  const ocrPick = document.getElementById("ocrPick");
  const ocrRun = document.getElementById("ocrRun");
  const ocrApply = document.getElementById("ocrApply");
  const ocrClose = document.getElementById("ocrClose");
  const ocrOpen = document.getElementById("ocrFab");
  const ocrPreview = document.getElementById("ocrPreview");
  const ocrPreviewImg = document.getElementById("ocrPreviewImg");
  const ocrFileName = document.getElementById("ocrFileName");
  const ocrMetaHint = document.getElementById("ocrMetaHint");
  const ocrTargetSel = document.getElementById("ocrTarget");
  const ocrSource = document.getElementById("ocrSource");
  const ocrRender = document.getElementById("ocrRender");

  function ocrSourceText() {
    return String(ocrSource.value || "").trim();
  }
  function draftHasMathDelimiters(src) {
    return /\$\$|\\\[|\\\(|\$[^$\n]/.test(String(src || ""));
  }
  function paintOcrPreview() {
    const src = String(ocrSource.value || "");
    const trimmed = src.trim();
    ocrRender.classList.toggle("is-empty", !trimmed);
    ocrRender.removeAttribute("data-tex");
    if (!trimmed) {
      ocrRender.innerHTML = "识别或粘贴源码后，这里显示公式渲染。填入仍用上方源码，不是预览 HTML。";
      return;
    }
    try {
      if (draftHasMathDelimiters(src)) {
        ocrRender.innerHTML = renderMathMarkdown(src);
        return;
      }
      ocrRender.setAttribute("data-tex", trimmed);
      if (typeof katex !== "undefined") {
        try {
          katex.render(trimmed, ocrRender, { throwOnError: false, displayMode: true, strict: "ignore", trust: false });
        } catch (e1) {
          ocrRender.innerHTML = "<code>" + escapeHtml(trimmed) + "</code>";
        }
      } else {
        ocrRender.innerHTML = "<code>" + escapeHtml(trimmed) + "</code>";
      }
    } catch (e) {
      ocrRender.innerHTML = "<code>" + escapeHtml(trimmed) + "</code>";
    }
  }
  function setOcrMsg(text, isErr) {
    ocrMsg.textContent = text || "";
    ocrMsg.className = "ocr-msg" + (isErr ? " err" : "");
  }
  function syncOcrButtons() {
    ocrRun.disabled = !(ocrPayload && ocrPayload.dataUrl) || ocrBusy;
    ocrApply.disabled = !ocrSourceText() || ocrBusy || !ocrTargetSel.value;
    ocrPick.disabled = ocrBusy;
    ocrTargetSel.disabled = ocrBusy;
    ocrSource.disabled = ocrBusy;
    ocrRun.textContent = ocrBusy ? "识别中…" : "识别";
    ocrPick.textContent = ocrPayload ? "更换图片" : "选择手写图片";
  }
  function fillOcrTargetOptions() {
    const keep = String(ocrTargetSel.value || ocrTargetI || "");
    ocrTargetSel.innerHTML = "";
    qRoot.querySelectorAll("textarea[data-i]").forEach(function (ta) {
      const opt = document.createElement("option");
      opt.value = ta.dataset.i;
      const filled = String(ta.value || "").trim() ? "（已有作答）" : "";
      opt.textContent = "第 " + ta.dataset.i + " 题" + filled;
      ocrTargetSel.appendChild(opt);
    });
    let pick = keep;
    if (!pick || !ocrTargetSel.querySelector('option[value="' + pick + '"]')) {
      pick = "";
      qRoot.querySelectorAll("textarea[data-i]").forEach(function (ta) {
        if (!pick && !String(ta.value || "").trim()) pick = ta.dataset.i;
      });
      if (!pick && ocrTargetSel.options.length) pick = ocrTargetSel.options[0].value;
    }
    ocrTargetSel.value = pick;
    ocrTargetI = pick;
  }
  function openOcrSheet() {
    fillOcrTargetOptions();
    ocrSheet.classList.add("is-open");
    ocrSheet.setAttribute("aria-hidden", "false");
    paintOcrPreview();
    syncOcrButtons();
  }
  function closeOcrSheet() {
    ocrSheet.classList.remove("is-open");
    ocrSheet.setAttribute("aria-hidden", "true");
  }
  function fileToOcrPayload(file, done) {
    if (!file) { done(new Error("empty")); return; }
    const reader = new FileReader();
    reader.onload = function () {
      const dataUrl = String(reader.result || "");
      done(null, { dataUrl: dataUrl, filename: file.name || "answer.jpg", name: file.name || "手写图片" });
    };
    reader.onerror = function () { done(new Error("read_failed")); };
    reader.readAsDataURL(file);
  }
  function ocrErrorText(code) {
    const map = {
      empty_image: "请先选择手写图片。",
      image_too_large: "图片过大，请换一张更清晰的近拍。",
      payload_too_large: "图片过大，请换一张。",
      deepseek_not_configured: "手写识别未配置，请改用手打。",
      simpletex_not_configured: "手写识别未配置，请改用手打。",
      ocr_failed: "识别服务暂时不可用，请稍后重试。",
      timeout: "识别超时，请稍后重试。",
      ocr_disabled: "手写识别已关闭，请改用手打。",
      empty_ocr: "未识别出文字，请换一张更清晰、光线更好的图。",
    };
    const c = String(code || "");
    if (map[c]) return map[c];
    if (c.indexOf("http_") === 0) return "识别服务暂时不可用（" + c + "）。";
    return c ? ("识别失败：" + c) : "识别失败，请稍后重试。";
  }

  ocrOpen.addEventListener("click", openOcrSheet);
  ocrSheet.addEventListener("click", function (e) {
    if (e.target === ocrSheet) closeOcrSheet();
  });
  ocrClose.addEventListener("click", closeOcrSheet);
  ocrTargetSel.addEventListener("change", function () {
    ocrTargetI = ocrTargetSel.value;
    syncOcrButtons();
  });
  ocrSource.addEventListener("input", function () {
    paintOcrPreview();
    syncOcrButtons();
  });
  document.querySelectorAll("[data-ocr-mode]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (ocrBusy) return;
      ocrMode = btn.getAttribute("data-ocr-mode") === "formula" ? "formula" : "document";
      document.querySelectorAll("[data-ocr-mode]").forEach(function (b) {
        b.classList.toggle("is-on", b.getAttribute("data-ocr-mode") === ocrMode);
      });
    });
  });
  ocrPick.addEventListener("click", function () { ocrFile.click(); });
  ocrFile.addEventListener("change", function () {
    const file = ocrFile.files && ocrFile.files[0];
    ocrFile.value = "";
    if (!file) return;
    setOcrMsg("正在读取图片…", false);
    fileToOcrPayload(file, function (err, payload) {
      if (err || !payload) {
        ocrPayload = null;
        ocrPreview.hidden = true;
        setOcrMsg("读取图片失败。", true);
        syncOcrButtons();
        return;
      }
      ocrPayload = payload;
      ocrSource.value = "";
      ocrPreviewImg.src = payload.dataUrl;
      ocrFileName.textContent = payload.name || "手写图片";
      ocrMetaHint.textContent = ocrMode === "formula" ? "公式加强 · 按 LaTeX 转写，识别后核对。" : "整页 markdown · 识别后核对源码与预览。";
      ocrPreview.hidden = false;
      paintOcrPreview();
      setOcrMsg("已选图，点「识别」生成源码。", false);
      syncOcrButtons();
    });
  });
  ocrRun.addEventListener("click", function () {
    if (!ocrPayload || !ocrPayload.dataUrl || ocrBusy) return;
    ocrBusy = true;
    syncOcrButtons();
    setOcrMsg(ocrMode === "formula" ? "正在识别公式…" : "正在整页识别…", false);
    fetch("/e/" + TOKEN + "/ocr", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        image: ocrPayload.dataUrl,
        filename: ocrPayload.filename || "answer.jpg",
        mode: ocrMode,
      }),
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (pack) {
        ocrBusy = false;
        const data = pack.body || {};
        if (!data.ok) {
          setOcrMsg(ocrErrorText(data.error), true);
          syncOcrButtons();
          return;
        }
        const text = String(data.text || "").trim();
        ocrSource.value = text;
        paintOcrPreview();
        const conf = (typeof data.conf === "number") ? (" · 置信 " + Math.round(data.conf * 100) + "%") : "";
        if (text) {
          ocrMetaHint.textContent = "识别完成" + conf + "。可改源码，预览会跟着变。";
          setOcrMsg("识别完成" + conf + "。核对预览后点「填入本题」。", false);
        } else {
          setOcrMsg(ocrErrorText("empty_ocr"), true);
        }
        syncOcrButtons();
      })
      .catch(function (e) {
        ocrBusy = false;
        var name = (e && e.name) || "";
        setOcrMsg(
          name === "SyntaxError" ? "识别结果无法读取，请稍后重试。" : "网络错误，识别未完成。",
          true
        );
        syncOcrButtons();
      });
  });
  ocrApply.addEventListener("click", function () {
    const text = ocrSourceText();
    const qi = String(ocrTargetSel.value || ocrTargetI || "");
    if (!text || !qi) return;
    const ta = qRoot.querySelector('textarea[data-i="' + qi + '"]');
    if (!ta) {
      setOcrMsg("找不到第 " + qi + " 题作答框。", true);
      return;
    }
    const prev = String(ta.value || "").trim();
    ta.value = prev ? (prev + "\n\n" + text) : text;
    ta.dispatchEvent(new Event("input", { bubbles: true }));
    closeOcrSheet();
    try {
      ta.scrollIntoView({ behavior: "smooth", block: "center" });
      ta.focus();
    } catch (e) {}
  });

  async function loadPaper() {
    const r = await fetch("/e/" + TOKEN + "/data", { cache: "no-store" });
    const data = await r.json();
    if (!r.ok || !data.ok) {
      boot.className = "status err";
      boot.textContent = (data && data.error) || ("HTTP " + r.status);
      return;
    }
    const paper = data.paper;
    boot.hidden = true;
    head.hidden = false;
    actions.hidden = false;
    ocrOpen.hidden = false;
    titleEl.textContent = paper.title || paper.paper_id || I18N.title;
    metaEl.textContent =
      I18N.metaId + (paper.paper_id || "-") +
      " " + I18N.metaSubj + (paper.subject || "-") +
      " " + (paper.n_questions || (paper.items || []).length) + I18N.metaQ +
      (data.exp ? (" " + I18N.metaExp + data.exp) : "");
    if (data.exp) paperExp = data.exp;
    qRoot.innerHTML = "";
    (paper.items || []).forEach(function (it) {
      const card = document.createElement("section");
      card.className = "q";
      const h = document.createElement("h2");
      h.textContent = I18N.qPrefix + it.i + I18N.qSuffix + (it.form_label ? ("(" + it.form_label + ")") : "");
      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = renderMathMarkdown(it.question_md || "");
      const lab = document.createElement("label");
      lab.className = "ans";
      lab.textContent = I18N.zone + it.i;
      const ta = document.createElement("textarea");
      ta.dataset.i = String(it.i);
      ta.placeholder = I18N.placeholder;
      lab.appendChild(ta);
      card.appendChild(h); card.appendChild(body); card.appendChild(lab);
      qRoot.appendChild(card);
    });
  }

  submitBtn.addEventListener("click", async function () {
    if (submitBtn.disabled || document.body.classList.contains("is-sealed")) return;
    if (!window.confirm(I18N.submitConfirm)) return;
    if (submitBtn.disabled || document.body.classList.contains("is-sealed")) return;
    const answers = collectAnswers();
    submitBtn.disabled = true;
    submitBtn.textContent = I18N.submitting;
    reportEl.hidden = true;
    try {
      const r = await fetch("/e/" + TOKEN + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers: answers, uid: UID }),
      });
      const data = await r.json();
      reportEl.hidden = false;
      if (!r.ok || !data.ok) {
        reportEl.textContent = (data && data.error) || ("HTTP " + r.status);
      } else {
        applySeal(data.report || "");
        return;
      }
    } catch (e) {
      reportEl.hidden = false;
      reportEl.textContent = String(e);
    }
    submitBtn.disabled = false;
    submitBtn.textContent = I18N.submit;
  });

  function startExam() {
    return loadPaper()
      .then(function () { return restoreDraft(); })
      .then(function (restored) {
        if (restored) draftNote.hidden = false;
      })
      .then(function () { wireAutosave(); });
  }

  let paperExp = "";
  function formatLeft(exp) {
    const end = Date.parse(exp || "");
    if (!end) return "";
    const left = end - Date.now();
    if (left <= 0) return "已截止";
    const totalMin = Math.floor(left / 60000);
    const days = Math.floor(totalMin / (60 * 24));
    const hours = Math.floor((totalMin % (60 * 24)) / 60);
    const mins = totalMin % 60;
    if (days > 0) return "剩余 " + days + " 天 " + hours + " 小时";
    if (hours > 0) return "剩余 " + hours + " 小时 " + mins + " 分";
    return "剩余 " + Math.max(mins, 1) + " 分";
  }
  function tickClock() {
    const el = document.getElementById("timeLeft");
    if (!el) return;
    if (!paperExp) { el.textContent = ""; return; }
    const label = formatLeft(paperExp);
    el.textContent = label;
    if (label === "已截止" && !document.body.classList.contains("is-sealed")) {
      qRoot.querySelectorAll("textarea").forEach(function (ta) { ta.readOnly = true; });
      submitBtn.disabled = true;
      submitBtn.textContent = "已截止";
    }
  }
  function applySeal(report) {
    document.body.classList.add("is-sealed");
    const seal = document.getElementById("seal");
    if (seal) seal.hidden = false;
    qRoot.querySelectorAll("textarea").forEach(function (ta) { ta.readOnly = true; });
    actions.hidden = true;
    if (ocrOpen) ocrOpen.hidden = true;
    const fab = document.getElementById("gradeFab");
    const body = document.getElementById("gradeBody");
    if (body) body.textContent = report || "批改记录还没有写完。";
    if (fab) fab.hidden = false;
    draftNote.hidden = true;
    boot.hidden = true;
  }
  function enterWithUid(v) {
    UID = v;
    gate.hidden = true;
    boot.hidden = false;
    boot.className = "status";
    boot.textContent = "加载试卷中…";
    startExam().then(function () {
      if (window.__examSeal != null) applySeal(window.__examSeal);
      tickClock();
      setInterval(tickClock, 30000);
    });
  }
  function enterWithCode(code) {
    boot.hidden = false;
    boot.className = "status";
    boot.textContent = "正在核对口令…";
    fetch("/e/" + TOKEN + "/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code }),
    }).then(function (r) { return r.json().then(function (j) { return { okHttp: r.ok, body: j }; }); })
      .then(function (pack) {
        const data = pack.body || {};
        if (!pack.okHttp || !data.ok || !data.uid) {
          boot.className = "status err";
          boot.textContent = "口令不对。用老师私发的那一串数字。";
          return;
        }
        paperExp = data.exp || "";
        window.__examSeal = data.sealed ? (data.report || "") : null;
        enterWithUid(data.uid);
      })
      .catch(function () {
        boot.className = "status err";
        boot.textContent = "口令暂时对不上，稍后再试。";
      });
  }

  uidBtn.addEventListener("click", function () {
    const v = String(uidInput.value || "").trim();
    if (!/^[0-9]{4,24}$/.test(v)) {
      boot.hidden = false;
      boot.className = "status err";
      boot.textContent = "口令是一串数字。";
      return;
    }
    enterWithCode(v);
  });

  uidInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") uidBtn.click();
  });

  document.getElementById("restartBtn").addEventListener("click", function () {
    qRoot.querySelectorAll("textarea[data-i]").forEach(function (ta) { ta.value = ""; });
    draftNote.hidden = true;
    saveDraftNow();
  });

  loadScript("/static/katex/katex.min.js")
    .then(function () {
      if (typeof katex === "undefined") throw new Error("katex missing");
      boot.hidden = true;
      gate.hidden = false;
      const gradeFab = document.getElementById("gradeFab");
      const gradeSheet = document.getElementById("gradeSheet");
      if (gradeFab && gradeSheet) {
        gradeFab.addEventListener("click", function () {
          gradeSheet.classList.add("is-open");
          gradeSheet.setAttribute("aria-hidden", "false");
        });
        document.getElementById("gradeClose").addEventListener("click", function () {
          gradeSheet.classList.remove("is-open");
          gradeSheet.setAttribute("aria-hidden", "true");
        });
      }
    })
    .catch(function (e) {
      boot.hidden = false;
      boot.className = "status err";
      boot.textContent = I18N.katexFail + ": " + e;
    });
})();
  </script>
</body>
</html>
