<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能力概率 · Brain Prediction Console</title>
<meta name="description" content="capability-prob 事件预测控制台 —— 对齐 teaching LearnerParams · 本地 mock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/cap-style.css">
</head>
<body>

<div class="studio-bar" data-od-id="studio-bar">
  <label for="module-switch">模块</label>
  <select id="module-switch" aria-label="切换 Teaching / Capability">
    <option value="teaching">Teaching Shell · 练习台</option>
    <option value="brain" selected>Capability Brain · 事件预测</option>
  </select>
  <span class="hint">宽幅注记 · 多事件目录 · η/BKT ← VPS</span>
</div>

<div id="app">
  <header id="topbar" data-od-id="topbar">
    <div class="brand" data-od-id="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M12 3.5v17M3.5 12h17" stroke="currentColor" stroke-width="1.1"/>
          <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">能力概率</span>
        <span class="brand-sub">capability-prob ← teaching</span>
      </div>
    </div>

    <div class="event-chip" data-od-id="event-chip">
      <div class="chip-row">
        <span class="chip-key mono">EVENT</span>
        <label class="sr-only" for="event-select">选择预测事件</label>
        <select id="event-select" class="event-select mono" aria-label="选择预测事件"></select>
      </div>
      <span class="chip-title" id="eventTitle"></span>
      <div class="chip-blurb mono" id="eventBlurb"></div>
      <div class="learner-chip mono" id="learnerChip"></div>
    </div>

    <nav class="presets" id="presets" data-od-id="view-presets" aria-label="视图预设">
      <span class="presets-label mono">视图 VIEW</span>
      <button class="preset mono is-active" data-preset="left" type="button" aria-pressed="true">左视</button>
      <button class="preset mono" data-preset="right" type="button" aria-pressed="false">右视</button>
      <button class="preset mono" data-preset="top" type="button" aria-pressed="false">顶视</button>
      <button class="preset mono" data-preset="oblique" type="button" aria-pressed="false">斜视</button>
    </nav>
  </header>

  <main id="stage" class="stage is-cover" data-od-id="stage">
    <div id="orbit-ring" aria-hidden="true"></div>
    <svg id="brain-plate" data-od-id="brain-plate" viewBox="0 0 480 380" role="img" aria-label="预测脑平面墨线图"></svg>
    <svg id="leaders" data-od-id="leader-lines" aria-hidden="true"></svg>

    <section id="page-deck" class="page-deck" data-od-id="page-deck" aria-label="注记翻页">
      <div class="folio" id="folio" data-od-id="folio">
        <article class="card page" id="card-eta" data-region="frontal" data-page="0" data-od-id="card-eta" aria-hidden="true">
          <header class="card-head">
            <span class="card-plate mono">01</span>
            <span class="card-pos mono">额叶 · FRONTAL</span>
            <span class="card-title">领域效应量 η̂ + BKT</span>
          </header>
          <div class="card-body" id="eta-body"></div>
        </article>

        <article class="card page" id="card-prob" data-region="parietal" data-page="1" data-od-id="card-prob" aria-hidden="true">
          <header class="card-head">
            <span class="card-plate mono">02</span>
            <span class="card-pos mono">顶叶 · PARIETAL</span>
            <span class="card-title">事件成功概率</span>
          </header>
          <div class="card-body" id="prob-body"></div>
        </article>

        <article class="card page" id="card-paths" data-region="temporal" data-page="2" data-od-id="card-paths" aria-hidden="true">
          <header class="card-head">
            <span class="card-plate mono">03</span>
            <span class="card-pos mono">颞叶 · TEMPORAL</span>
            <span class="card-title">高频路径</span>
          </header>
          <div class="card-body" id="paths-body"></div>
        </article>

        <article class="card page" id="card-bottlenecks" data-region="occipital" data-page="3" data-od-id="card-bottlenecks" aria-hidden="true">
          <header class="card-head">
            <span class="card-plate mono">04</span>
            <span class="card-pos mono">枕叶 · OCCIPITAL</span>
            <span class="card-title">瓶颈节点</span>
          </header>
          <div class="card-body" id="bn-body"></div>
        </article>
      </div>

      <div class="page-chrome" data-od-id="page-chrome">
        <button type="button" class="page-nav" id="page-prev" data-od-id="page-prev" aria-label="上一页">‹</button>
        <div class="page-dots" id="page-dots" role="tablist" aria-label="页码">
          <button type="button" class="page-dot is-on" data-page="-1" role="tab" aria-selected="true" aria-label="封面"></button>
          <button type="button" class="page-dot" data-page="0" role="tab" aria-selected="false" aria-label="第 1 页 额叶"></button>
          <button type="button" class="page-dot" data-page="1" role="tab" aria-selected="false" aria-label="第 2 页 顶叶"></button>
          <button type="button" class="page-dot" data-page="2" role="tab" aria-selected="false" aria-label="第 3 页 颞叶"></button>
          <button type="button" class="page-dot" data-page="3" role="tab" aria-selected="false" aria-label="第 4 页 枕叶"></button>
        </div>
        <button type="button" class="page-nav" id="page-next" data-od-id="page-next" aria-label="下一页">›</button>
        <span class="page-index mono" id="page-index" data-od-id="page-index">封面</span>
      </div>
    </section>

    <p id="stage-hint" class="stage-hint" data-od-id="stage-hint">
      <span class="hint-key">SWIPE</span>
      左右滑动翻页 · 点脑叶可直达
    </p>
  </main>

  <footer id="footbar" data-od-id="footbar">
    <div class="foot-left">
      <button id="assume-toggle" class="assume-btn mono" type="button" aria-expanded="false" aria-controls="assumptions">
        <span class="assume-plus" aria-hidden="true">+</span> 假设与条件 · <span id="assume-count">4</span> 项
      </button>
      <div id="assumptions" class="assum" data-od-id="assumptions" hidden>
        <ol id="assume-list"></ol>
      </div>
    </div>
    <div class="disclaimer" data-od-id="disclaimer">概率预测 · 非预言 · BKT≠P̂ · 见假设</div>
  </footer>
</div>

<div id="boot" data-od-id="boot" role="status" aria-live="polite">
  <div class="boot-inner">
    <div class="boot-ring" aria-hidden="true"></div>
    <div class="boot-title">正在装配预测脑</div>
    <div class="boot-sub mono">teaching LearnerParams · 多事件 · 导师可写入</div>
  </div>
</div>

<script>
(function () {
  window.__capBootTimer = setTimeout(function () {
    var boot = document.getElementById('boot');
    if (boot && boot.isConnected) {
      boot.classList.add('done');
      setTimeout(function () { if (boot.parentNode) boot.remove(); }, 500);
    }
  }, 900);
  var sel = document.getElementById('module-switch');
  if (sel) {
    sel.addEventListener('change', function () {
      if (sel.value === 'teaching') location.href = '/practice';
    });
  }
})();
</script>
<script src="assets/cap-data.js"></script>
<script src="assets/cap-live.js"></script>
<script src="assets/brain-draw.js"></script>
<script src="assets/cap-app.js"></script>
</body>
</html>
