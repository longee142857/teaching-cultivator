<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>高校每日练习 · Teaching Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/katex/katex.min.css" />
  <script src="/static/katex/katex.min.js"></script>
  <style>
    :root {
      --bg: #F4EDE0;
      --surface: #F8F2E3;
      --fg: #2B2118;
      --muted: rgba(43,33,24,.62);
      --border: rgba(43,33,24,.22);
      --accent: #3A6B7C;
      --font-display: "Source Serif 4", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
      --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --ok: #3A6B7C;
      --bad: #A0432F;
      --warn: #7A5A2A;
      --on-accent: #F4EDE0;
      --soft-ok: rgba(58,107,124,.12);
      --soft-bad: rgba(139,58,58,.12);
      --hover: rgba(43,33,24,.06);
      --radius: 2px;
      --shadow: 0 10px 28px rgba(43,33,24,.10), 0 2px 6px rgba(43,33,24,.05);
      --rule-wave: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='6'><path d='M0 3.2 Q 7.5 1.4 15 3 T 30 3.1 T 45 2.9 T 60 3.2 T 75 3 T 90 3.1 T 105 2.9 T 120 3' fill='none' stroke='rgba(43,33,24,.32)' stroke-width='1.1' stroke-linecap='round'/></svg>");
      --rail: 64px;
      --ink: #2B2118;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(130% 90% at 50% 0%, rgba(43,33,24,.05), transparent 55%),
        var(--bg);
    }
    @media (max-width: 767.98px) {
      html, body { overflow: hidden; }
    }
    body { display: flex; flex-direction: column; }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.045'/></feComponentTransfer></filter><rect width='150' height='150' filter='url(%23n)'/></svg>");
    }
    .studio-bar, .app { position: relative; z-index: 1; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    h1 {
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(24px, 2.4vw, 32px); line-height: 1.35; letter-spacing: 0;
    }
    h2 {
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(18px, 1.6vw, 22px); line-height: 1.4; letter-spacing: 0;
    }
    h3 { font-weight: 550; font-size: 15px; line-height: 1.45; }
    .app {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .rail { display: none; }
    .tabbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 88%, transparent);
      backdrop-filter: blur(16px);
      padding: 4px var(--safe-r) calc(6px + var(--safe-b)) var(--safe-l);
      z-index: 20;
    }
    .tab-btn {
      appearance: none; border: 0; background: transparent;
      min-height: 48px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      color: var(--muted); font-size: 11px; font-weight: 550; letter-spacing: 0.02em;
      transition: color .16s ease, background .16s ease;
    }
    .tab-btn svg { width: 22px; height: 22px; }
    .tab-btn:hover { background: var(--hover); color: var(--fg); }
    .tab-btn.is-active { color: var(--accent); }
    .workspace { min-height: 0; min-width: 0; overflow: hidden; display: grid; grid-template-columns: 1fr; }
    .recents { display: none; }
    .tutor-strip {
      display: none; flex: 0 0 auto;
      gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 8px 14px;
      background: color-mix(in oklch, var(--surface) 70%, transparent);
      scrollbar-width: none;
    }
    .tutor-strip::-webkit-scrollbar { display: none; }
    .tutor-chip {
      appearance: none; flex: 0 0 auto; max-width: 68vw; min-width: 0;
      display: flex; flex-direction: column; gap: 1px; text-align: left;
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 2px; padding: 7px 12px; color: var(--fg);
    }
    .tutor-chip .tc-title,
    .tutor-chip .tc-sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
    }
    .tutor-chip .tc-title {
      font-size: 12px; font-weight: 550; line-height: 1.35;
    }
    .tutor-chip .tc-sub {
      font-size: 10px; color: var(--muted); font-family: var(--font-mono); letter-spacing: .02em;
    }
    .tutor-chip.is-active {
      border-color: color-mix(in oklch, var(--accent) 55%, var(--border));
      background: color-mix(in oklch, var(--accent) 8%, var(--surface));
    }
    .tc-empty {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em;
      color: var(--muted); padding: 8px 0;
    }
    .stage {
      min-height: 0; min-width: 0; height: 100%;
      display: flex; flex-direction: column;
      container-type: inline-size; container-name: stage;
      perspective: 1400px;
    }
    .content {
      flex: 1; min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: auto;
      padding: 14px 16px 20px;
    }
    .app-header {
      position: sticky; top: 0; z-index: 8;
      padding: calc(10px + var(--safe-t)) 16px 12px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 82%, transparent);
      backdrop-filter: blur(18px);
      display: grid; gap: 4px;
    }
    .brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .brand-row .brand-toggle {
      appearance: none; border: 0; background: none; padding: 0;
      font: inherit; color: inherit; cursor: pointer; display: flex; align-items: baseline; gap: 6px;
    }
    .brand-row .brand-toggle .fold-mark { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
    .brand {
      font-family: var(--font-display); font-weight: 600;
      font-size: 16px; line-height: 1.35; letter-spacing: 0;
    }
    .meta {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.02em; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row.between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }

    .pill {
      display: inline-flex; align-items: center;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--fg); font-size: 12px; line-height: 1.35;
      padding: 4px 8px; border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }
    .pill.warn {
      border-color: color-mix(in oklch, var(--warn) 40%, var(--border));
      background: color-mix(in oklch, var(--warn) 10%, var(--surface));
    }
    .pill.ok {
      border-color: color-mix(in oklch, var(--ok) 40%, var(--border));
      background: color-mix(in oklch, var(--ok) 10%, var(--surface));
    }

    .btn {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--fg);
      font-weight: 550; letter-spacing: 0.02em; text-decoration: none; width: 100%;
    }
    .btn:hover { background: var(--hover); color: var(--fg); }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    }
    .btn.primary:hover {
      background: color-mix(in oklch, var(--fg) 12%, var(--accent));
      border-color: color-mix(in oklch, var(--fg) 12%, var(--accent));
      color: var(--on-accent);
    }
    .btn.ghost { background: transparent; }
    .btn.ghost:hover { background: var(--hover); color: var(--fg); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.is-busy::before {
      content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
      vertical-align: -2px; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.primary:disabled:hover {
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    }
    .btn-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .btn-row.two { grid-template-columns: 1fr 1fr; }
    .text-link {
      appearance: none; border: 0; background: none;
      padding: 8px 0; min-height: 44px; color: var(--fg);
      text-decoration: underline; text-underline-offset: 3px;
      font-size: 13px; letter-spacing: 0.02em; text-align: left; width: auto;
    }
    .text-link:hover { background: var(--hover); color: var(--fg); }

    .tab-btn:focus-visible, .nav-btn:focus-visible, .btn:focus-visible,
    .text-link:focus-visible, .slot-row:focus-visible, .backlog-item:focus-visible,
    .fold-toggle:focus-visible, textarea:focus-visible, .recent-btn:focus-visible,
    .rail-toggle:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 8px; text-align: center; background: var(--bg);
    }
    .stat .n {
      font-family: var(--font-mono); font-size: 20px; font-weight: 550;
      line-height: 1.3; font-variant-numeric: tabular-nums;
    }
    .stat .t { font-size: 11px; letter-spacing: 0.02em; color: var(--muted); margin-top: 2px; }

    .slot-row, .backlog-item {
      appearance: none; width: 100%; text-align: left;
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 8px; min-height: 64px;
    }
    .slot-row {
      padding: 12px 14px; display: grid;
      grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    }
    .slot-row:hover, .backlog-item:hover { background: var(--hover); }
    .slot-row:disabled { opacity: 0.55; cursor: default; }
    .slot-row:disabled:hover { background: var(--surface); }
    .slot-row.is-done { opacity: 0.7; }
    .slot-row.is-overdue { border-color: color-mix(in oklch, var(--warn) 50%, var(--border)); }
    .slot-title { font-weight: 550; font-size: 14px; line-height: 1.4; }
    .slot-meta { font-size: 12px; color: var(--muted); line-height: 1.5; grid-column: 1 / 2; }
    .slot-status {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      color: var(--muted); justify-self: end; align-self: start; padding-top: 2px;
    }
    .slot-row.is-open .slot-status { color: var(--ok); }
    .slot-row.is-overdue .slot-status { color: var(--warn); }
    .backlog-item { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 52px; }
    .bi-title { font-size: 13px; font-weight: 550; line-height: 1.4; }
    .bi-meta { font-size: 12px; color: var(--muted); line-height: 1.5; }

    .hint {
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 8px; padding: 12px 14px;
      font-size: 13px; line-height: 1.7; color: var(--fg);
    }
    .math-block {
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 8px; padding: 14px 12px; overflow-x: auto; line-height: 1.5;
    }
    .math-block .katex-display { margin: 0.4em 0; }
    .math-fallback { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
    .stem-text { font-size: 16px; line-height: 1.8; max-width: 68ch; }
    .stem-text .katex-display, .msg-body .katex-display, .fold-panel .katex-display {
      margin: 0.5em 0; overflow-x: auto; overflow-y: hidden;
    }
    .stem-body { font-size: 16px; line-height: 1.8; max-width: 68ch; }
    .stem-body p { margin: 0.55em 0; }
    .stem-body p:first-child { margin-top: 0; }
    .stem-body .katex-display { margin: 0.75em 0; overflow-x: auto; overflow-y: hidden; }
    .mcq-options {
      list-style: none; margin: 14px 0 0; padding: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .mcq-options li {
      display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px;
      align-items: start;
      border: 1px dashed rgba(43,33,24,.28);
      background: rgba(244,237,224,.55);
      padding: 10px 12px;
    }
    .mcq-letter {
      font-family: var(--font-mono); font-weight: 600;
      color: var(--accent); padding-top: 1px;
    }
    .mcq-options .katex { font-size: 1.02em; }

    textarea.answer, textarea.composer {
      width: 100%; resize: vertical; border: 1px solid var(--border);
      background: var(--bg); padding: 12px; border-radius: 8px; line-height: 1.7;
    }
    textarea.answer { min-height: 128px; }
    textarea.answer.is-invalid { border-color: var(--bad); }
    textarea.composer { min-height: 44px; max-height: 120px; resize: none; }
    textarea::placeholder { color: var(--muted); }
    .answer-preview-wrap { display: grid; gap: 8px; }
    .answer-preview {
      min-height: 72px;
    }
    .answer-preview.is-empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .answer-preview .katex-display {
      margin: 0.4em 0; overflow-x: auto; overflow-y: hidden;
    }
    .field-error { font-size: 13px; color: var(--bad); line-height: 1.5; }
    .ocr-zone { display: grid; gap: 8px; }
    .ocr-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ocr-preview {
      display: flex; gap: 10px; align-items: center;
      border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px;
      background: var(--bg);
    }
    .ocr-preview img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 6px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--surface);
    }
    .ocr-meta { font-size: 12px; color: var(--muted); line-height: 1.55; min-width: 0; }
    .ocr-meta strong { display: block; color: var(--fg); font-weight: 550; font-size: 13px; }
    .ocr-modes { display: flex; gap: 6px; flex-wrap: wrap; }
    .ocr-mode {
      appearance: none; border: 1px solid var(--border); background: var(--bg);
      color: var(--muted); border-radius: 999px; padding: 6px 12px; min-height: 32px;
      font-size: 12px; font-weight: 550;
    }
    .ocr-mode.is-on {
      border-color: var(--fg); background: var(--surface); color: var(--fg);
    }

    .desk-split {
      display: grid; gap: 12px;
      grid-template-columns: 1fr;
      grid-template-areas: "stem" "progress" "answer";
    }
    .stem-card { grid-area: stem; }
    .progress-card { grid-area: progress; }
    .answer-card { grid-area: answer; }
    .stem-card, .answer-card, .progress-card { min-width: 0; }
    .side-rail { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .rail-item {
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.55;
    }
    .rail-item .k { color: var(--muted); font-size: 11px; letter-spacing: 0.02em; margin-bottom: 2px; }
    .rail-item:last-child { grid-column: 1 / -1; }
    .progress-track {
      height: 6px; border-radius: 99px; overflow: hidden;
      background: color-mix(in oklch, var(--fg) 8%, var(--bg));
    }
    .progress-fill { height: 100%; width: 0; background: color-mix(in oklch, var(--fg) 52%, var(--bg)); }

    .result-banner { border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: grid; gap: 6px; }
    .result-banner.ok { background: var(--soft-ok); border-color: color-mix(in oklch, var(--ok) 35%, var(--border)); }
    .result-banner.bad { background: var(--soft-bad); border-color: color-mix(in oklch, var(--bad) 35%, var(--border)); }
    .result-mark { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.25; }
    .result-verdict { font-size: 13px; color: var(--muted); }
    .result-mark.ok { color: var(--ok); }
    .result-mark.bad { color: var(--bad); }
    .result-banner.warn {
      background: color-mix(in oklch, var(--warn) 10%, var(--surface));
      border-color: color-mix(in oklch, var(--warn) 35%, var(--border));
    }
    .result-mark.warn { color: var(--warn); }
    .grade-chip {
      display: inline-block; font-family: var(--font-mono);
      font-size: 10px; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px;
      border: 1px solid color-mix(in oklch, var(--ok) 40%, var(--border));
      background: color-mix(in oklch, var(--ok) 10%, var(--surface)); color: var(--ok);
    }
    .grade-chip.is-degraded {
      border-color: color-mix(in oklch, var(--warn) 45%, var(--border));
      background: color-mix(in oklch, var(--warn) 12%, var(--surface)); color: var(--warn);
    }

    .fold { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .fold-toggle {
      width: 100%; appearance: none; border: 0; background: var(--bg);
      padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
      min-height: 44px; font-weight: 550; text-align: left; color: var(--fg);
    }
    .fold-toggle:hover { background: var(--hover); color: var(--fg); }
    .fold-panel { display: none; padding: 12px 14px; font-size: 15px; line-height: 1.75; background: var(--surface); }
    .fold.is-open .fold-panel { display: block; }
    .fold.is-open .fold-toggle { border-bottom: 1px solid var(--border); }

    .empty {
      min-height: 52dvh; display: flex; flex-direction: column;
      justify-content: center; gap: 12px; padding: 28px 16px; text-align: center;
    }
    .empty p { color: var(--muted); font-size: 15px; line-height: 1.75; max-width: 32ch; margin-inline: auto; }
    .empty .mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; }
    .calm-note {
      border: 1px dashed rgba(43,33,24,.28);
      background: rgba(244,237,224,.5);
      border-radius: 2px; padding: 12px 14px;
      font-size: 13px; line-height: 1.7; color: var(--muted);
    }
    .mark-box {
      width: 48px; height: 48px; margin: 0 auto; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      display: grid; place-items: center; color: var(--muted);
    }

    .query-strip {
      font-family: var(--font-mono); font-size: 11px; line-height: 1.55;
      letter-spacing: 0.01em; color: var(--muted);
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 8px; padding: 8px 10px; word-break: break-all;
    }
    .dock {
      position: relative;
      border-top: 1px solid transparent; background: var(--surface);
      padding: 10px 16px calc(10px + var(--safe-b));
    }
    .dock::before {
      content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 6px;
      background-image: var(--rule-wave); background-repeat: repeat-x;
      background-position: left center; background-size: auto 6px;
      pointer-events: none;
    }
    .app:not(.is-practice-dock) .practice-dock { display: none; }
    .app:not(.is-tutor) .chat-dock { display: none; }
    .chat-dock .composer-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .chat-dock .btn.primary { width: auto; min-width: 72px; padding-inline: 18px; }

    .brain-host { flex: 1; min-height: 0; }
    .brain-host iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
    .app.is-brain .app-header, .app.is-brain .page-chrome, .app.is-brain .tutor-strip,
    .app.is-brain .content, .app.is-brain .practice-dock, .app.is-brain .chat-dock { display: none; }
    .app.is-brain .brain-host { display: flex; flex-direction: column; }

    .context-chip {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
    }

    }

    }

    .thread { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
    .msg { display: grid; gap: 4px; max-width: min(72ch, 100%); }
    .msg.is-user { margin-left: auto; }
    .msg-who { font-size: 11px; letter-spacing: 0.02em; color: var(--muted); }
    .msg-body { font-size: 15px; line-height: 1.75; }
    .msg.is-user .msg-body {

    }
    .pending { font-size: 13px; color: var(--muted); }

    .nav-btn, .rail-toggle {

    }
    .nav-btn:hover, .rail-toggle:hover { background: var(--hover); color: var(--fg); }

    @container stage (min-width: 640px) {

      .app.is-tutor .recents {

      }
      .recent-btn:hover { background: var(--hover); color: var(--fg); }
      .recent-btn.is-active { border-color: var(--border); background: var(--surface); box-shadow: var(--shadow); }
      .recent-title {

      .studio-bar select { min-height: 32px; padding-top: 4px; padding-bottom: 4px; font-size: 11px; }

    /* hand-drawn sketch overrides */
    .studio-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;

      padding: 8px 14px; border-bottom: 1px solid transparent;

      flex: 0 0 auto;
    }
    .studio-bar::after, .app-header::after {

      pointer-events: none; z-index: 1;
    }
    .studio-bar label {

      color: var(--muted); text-transform: uppercase;
    }

      padding: 6px 28px 6px 10px; min-height: 36px; border-radius: 2px;
      background-image: linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%);

    .studio-bar .hint {

    }
    .app { flex: 1; min-height: 0; }
    .card, .slot-row, .backlog-item, .pill, .dock, .app-header, .tabbar, .rail, .msg.tutor, .msg.user, .chat-compose textarea {
      border-radius: 2px !important;

    }
    .card {
      border: 1px solid rgba(43,33,24,.26) !important;
      background: linear-gradient(180deg, rgba(249,243,231,.97), rgba(240,231,213,.95)) !important;
      transform: rotate(-0.15deg);
    }
    .card:nth-child(even) { transform: rotate(0.12deg); }
    .slot-row, .backlog-item {
      border: 1px dashed rgba(43,33,24,.30) !important;
      background: rgba(244,237,224,.72) !important;
    }
    .btn.primary {
      background: var(--ink) !important;
      color: var(--bg) !important;
      border-radius: 2px !important;
      box-shadow: 2px 2px 0 rgba(43,33,24,.18) !important;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .progress-fill { background: var(--accent) !important; }
    .mark {
      background: var(--ink) !important; color: var(--bg) !important;
      border-radius: 2px !important;
    }
    .tab-btn.is-active, .nav-btn.is-active { color: var(--accent) !important; }
    .app-header {
      background: linear-gradient(180deg, rgba(249,243,231,.92), rgba(236,227,210,.82)) !important;
      border-bottom-color: transparent !important;
    }
    .hint strong { color: var(--warn); }

    /* ---- 手划书页：练习台视图切换 ---- */
    .stage { position: relative; }
    .flip-sheet {
      transform-origin: left center;
      will-change: transform, opacity;
      transition:
        transform .22s cubic-bezier(.22,.7,.2,1),
        opacity .18s ease;
    }
    .flip-sheet.is-enter-right {
      transform: translateX(10%) scale(.995);
      opacity: 0;
    }
    .flip-sheet.is-enter-left {
      transform: translateX(-10%) scale(.995);
      opacity: 0;
    }
    .flip-sheet.is-open {
      transform: translateX(0) scale(1);
      opacity: 1;
    }
    .flip-sheet.is-exit-left {
      transform: translateX(-12%) scale(.99);
      opacity: 0;
      pointer-events: none;
    }
    .flip-sheet.is-exit-right {
      transform: translateX(12%) scale(.99);
      opacity: 0;
      pointer-events: none;
    }
    .stage.is-swiping { cursor: grabbing; }
    .stage.is-swiping .content { touch-action: none; overflow: hidden; }
    .page-chrome {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 44px; padding: 0 12px 8px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 82%, transparent);
    }
    .app.is-tutor .page-chrome { display: none; }
    .page-nav {
      width: 44px; height: 44px; flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
      font-size: 22px; line-height: 1; border-radius: var(--radius);
      transition: background .15s, border-color .15s, color .15s;
    }
    .page-nav:hover { background: var(--hover); color: var(--fg); border-color: var(--fg); }
    .page-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .page-nav:disabled { opacity: .35; cursor: default; color: var(--muted); }
    .page-dots { display: flex; align-items: center; gap: 8px; }
    .page-dot {
      width: 10px; height: 10px; padding: 0; border-radius: 50%;
      border: 1px solid rgba(43,33,24,.4); background: transparent; cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .page-dot.is-on { background: var(--ink); border-color: var(--ink); transform: scale(1.15); }
    .page-dot:hover { border-color: var(--fg); }
    .page-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .page-index {
      min-width: 5.5em; text-align: right;
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: .08em; color: var(--muted);
    }
    .flip-hint {
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: .08em; color: var(--muted);
      margin-top: 2px;
    }
    .flip-hint b { color: var(--accent); font-weight: 550; letter-spacing: .12em; }

  </style>
</head>
<body>
  <div class="studio-bar" data-od-id="studio-bar">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>

      <button type="button" class="tab-btn" data-nav="practice" data-od-id="tab-practice">

        讲师

  </div>

  <script>
    (function () {
      "use strict";

      var API_BASE = "";
      var SLOTS = [];
      var ITEMS = [];
      var SERVER_WEAK_HINT = "";
      var BOOT_READY = false;
      var BOOT_ERROR = "";
      var CAPABILITY = null;
      var PLACEHOLDER_LEARNER = "stu_1024";

      function apiUrl(path) {
        return (API_BASE || "") + path;
      }
      function apiHeaders(extra) {
        var h = { "Accept": "application/json" };
        if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
        if (typeof state !== "undefined" && state && state.learner) h["X-Learner-Id"] = state.learner;
        return h;
      }
      function applyBootstrap(data) {
        if (!data || !data.ok) {
          BOOT_ERROR = (data && data.error) || "bootstrap_failed";
          CAPABILITY = (data && data.capability) || null;
          return false;
        }
        SLOTS = data.slots || [];
        ITEMS = data.items || [];
        SERVER_WEAK_HINT = data.weakHint || "";
        CAPABILITY = data.capability || null;
        if (data.answered) {
          Object.keys(data.answered).forEach(function (id) {
            state.answered[id] = data.answered[id];
          });
        }
        BOOT_READY = true;
        BOOT_ERROR = "";
        return true;
      }
      function isPlaceholderLearner(id) {
        var s = String(id || "").trim();
        return !s || s === PLACEHOLDER_LEARNER;
      }
      function learnerFrom(params, saved) {
        var q = ((params && params.get("learner")) || "").trim();
        if (q && !isPlaceholderLearner(q)) return q;
        var s = saved && saved.learner ? String(saved.learner).trim() : "";
        if (s && !isPlaceholderLearner(s)) return s;
        return q && !isPlaceholderLearner(q) ? q : "";
      }
      function calmError(msg) {
        var s = String(msg || "").trim();
        if (!s) return "";
        if (/has no attribute|Traceback|AttributeError|TypeError|NoneType|internal/i.test(s)) {
          return "部分数据暂时读不到，练习仍可继续。";
        }
        if (s === "bootstrap_failed" || s === "network") return "练习台暂时连不上，请稍后重试。";
        return s;
      }
      function wideDesktop() {
        return window.matchMedia && window.matchMedia("(min-width: 768px)").matches;
      }
      function ensureItemFromServer(itemId, pushId) {
        return fetch(apiUrl("/api/v1/practice/item?learner=" + encodeURIComponent(state.learner || "")
          + (itemId ? "&item=" + encodeURIComponent(itemId) : "")
          + (pushId ? "&push=" + encodeURIComponent(pushId) : "")), {
          headers: apiHeaders()
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (!data || !data.ok || !data.item) return null;
          var it = data.item;
          var ix = findItemIndex(it.id);
          if (ix < 0) ITEMS.push(it);
          else ITEMS[ix] = it;
          if (data.result) state.answered[it.id] = data.result;
          return it;
        }).catch(function () { return null; });
      }

      var STORE = "teaching-shell-v2-state";
      var SWIPE_THRESHOLD = 56;
      var VIEW_ORDER = { today: 0, desk: 1, result: 2, done: 3, invalid: 4 };
      var VIEW_LABEL = { today: "今日", desk: "主台", result: "批改", done: "完成", invalid: "失效" };
      var flipDir = 0;
      var flipBusy = false;
      var lastPaintKey = "";
      var appEl = document.getElementById("app");
      var root = document.getElementById("root");
      var headerEl = document.getElementById("header");
      var recentsEl = document.getElementById("recents");
      var practiceDock = document.getElementById("practice-dock");
      var composerInput = document.getElementById("composer-input");
      var stageEl = document.querySelector(".stage");
      var streamTimer = null;
      var brainHost = document.getElementById("brain-host");
      var brainFrame = document.getElementById("brain-frame");
      var brainLoadedFor = "";

      var state = {
        mode: "practice",
        view: "today",
        learner: "",
        push: null,
        index: 0,
        answered: {},
        draft: "",
        lastResult: null,
        explainOpen: false,
        fromDeepLink: false,
        error: "",
        railExpanded: true,
        contextItemId: null,
        threads: {},
        recents: [],
        headerCollapsed: true,
        ocrBusy: false,
        ocrMsg: "",
        ocrMode: "document"
      };

          return r.json().then(function (j) { return { status: r.status, body: j, sse: false }; });
        }).then(function (pack) {
          if (state.mode !== "tutor") { state.pending = false; setSendEnabled(true); return; }
          if (pack && pack.sse) return;
          var msg;
          if (pack.status === 501 || (pack.body && pack.body.error === "tutor_agent_not_wired")) {
            msg = "讲师 agent 尚未接入。练习批改已走后端；对话接口契约见 /api/v1/agent/manifest。你刚才问：「" + trimmed + "」。";
          } else if (pack.body && pack.body.reply && pack.status < 500) {
            msg = pack.body.reply;
            applyTutorMeta(pack.body);
          } else {
            var err = (pack.body && (pack.body.error || pack.body.detail || pack.body.hint)) || "";
            msg = err
              ? String(err)
              : ("讲师服务暂时不可用" + (pack.status ? "（" + pack.status + "）" : "") + "。");
          }
          startStream(msg);
        })
          .catch(function (e) {
            if (state.mode !== "tutor") { state.pending = false; setSendEnabled(true); return; }
            startStream((e && e.message) ? String(e.message) : "讲师服务暂时不可用。");
          });
      }

      function consumeSse(r) {
        return new Promise(function (resolve) {
          var msgs = threadOf(state.contextItemId);
          var msg = { role: "tutor", text: "", streaming: true, citations: [] };
          msgs.push(msg);
          state.pending = false;
          setSendEnabled(true);
          renderChat();
          var reader = (r.body && r.body.getReader) ? r.body.getReader() : null;
          if (!reader) { msg.streaming = false; persist(); resolve({ sse: true }); return; }
          var decoder = new TextDecoder();
          var buf = "";
          var evtType = "";
          function feed() {
            reader.read().then(function (step) {
              if (step.done) { msg.streaming = false; applyTutorMeta(msg); persist(); resolve({ sse: true }); return; }
              buf += decoder.decode(step.value, { stream: true });
              var idx;
              while ((idx = buf.indexOf("\n")) >= 0) {
                var line = buf.slice(0, idx).trim();
                buf = buf.slice(idx + 1);
                if (line.indexOf("event:") === 0) { evtType = line.slice(6).trim(); continue; }
                if (line.indexOf("data:") !== 0) continue;
                var payload = line.slice(5).trim();
                if (!payload) continue;
                try {
                  var ev = JSON.parse(payload);
                  if (ev && ev.text) { msg.text += ev.text; patchLastMessage(msg); }
                  if (ev && ev.citations) msg.citations = ev.citations;
                  if (ev && ev.detached !== undefined) state.tutorDetached = !!ev.detached;
                  if (evtType === "error") {
                    msg.text += (msg.text ? "\n" : "") + "[导师团] " + (ev.message || "unknown");
                    patchLastMessage(msg);
                  }
                  if (evtType === "done") {
                    // done.reply 是权威全文，防 delta 丢块
                    if (ev && ev.reply) msg.text = ev.reply;
                    msg.streaming = false;
                    applyTutorMeta(msg);
                    persist();
                    renderChat();
                  }
                  evtType = "";
                } catch (e) {}
              }
              feed();
            }).catch(function () {
              msg.streaming = false;
              persist();
              resolve({ sse: true });
            });
          }
          feed();
        });
      }

      function applyTutorMeta(m) {
        if (m && m.citations) state.lastCitations = m.citations;
        if (m && m.detached !== undefined) state.tutorDetached = !!m.detached;
        renderHeader();
        renderChat();
      }

      function renderMathMarkdown(src) {
        var placeholders = [];
        function stash(tex, display) {
          var i = placeholders.length;
          placeholders.push({ tex: tex, display: display });
          return "@@MATH" + i + "@@";
        }
        var text = String(src || "");
        text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { return stash(String(tex).trim(), true); });
        text = text.replace(/\\\[([\s\S]+?)\\\]/g, function (_, tex) { return stash(String(tex).trim(), true); });
        text = text.replace(/\\\(([\s\S]+?)\\\)/g, function (_, tex) { return stash(String(tex).trim(), false); });
        text = text.replace(/\$([^$\n]+?)\$/g, function (_, tex) { return stash(String(tex).trim(), false); });
        var html = esc(text);
        html = html.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
        html = html.replace(/^##\s+(.+)$/gm, "<h2>$1</h2>");
        html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\n{2,}/g, "</p><p>");
        html = "<p>" + html + "</p>";
        html = html.replace(/@@MATH(\d+)@@/g, function (_, idx) {
          var item = placeholders[Number(idx)];
          var K = window.katex;
          if (!item || !K) {
            return "<code>" + esc(item ? item.tex : "") + "</code>";
          }
          try {
            return K.renderToString(item.tex, {
              displayMode: !!item.display,
              throwOnError: false,
              strict: "ignore",
              trust: false
            });
          } catch (e) {
            return "<code>" + esc(item.tex) + "</code>";
          }
        });
        return html;
      }
      function renderStemHtml(item) {
        var stem = (item && item.stem) || "";
        var title = (item && item.title) || "";
        if (title && stem.indexOf(title) === 0) {
          var rest = stem.slice(title.length).replace(/^[\s：:·。.\-—]+/, "");
          if (rest) stem = rest;
        }
        var html = '<div class="stem-body" data-od-id="item-stem">' + renderMathMarkdown(stem) + "</div>";
        var opts = (item && item.options) || [];
        if (opts.length) {
          html += '<ol class="mcq-options" data-od-id="item-options">';
          opts.forEach(function (o) {
            html += '<li><span class="mcq-letter">' + esc(o.letter) + "</span><div>" +
              renderMathMarkdown(o.text || "") + "</div></li>";
          });
          html += "</ol>";
        } else if (item && item.katex && !/\$|\\\[|\\\(/.test(stem)) {
          html += '<div class="math-block" data-od-id="katex-formula" data-tex="' + escAttr(item.katex) + '"></div>';
        }
        return html;
      }
      function mountMath() {
        root.querySelectorAll("[data-tex]").forEach(function (el) {
          if (el.id === "answer-preview") return;
          var tex = el.getAttribute("data-tex") || "";
          if (!tex) return;
          if (window.katex) {
            try { window.katex.render(tex, el, { throwOnError: false, displayMode: true }); }
            catch (e) { el.innerHTML = '<div class="math-fallback">' + esc(tex) + "</div>"; }
          } else {
            el.innerHTML = '<div class="math-fallback">' + esc(tex) + "</div>";
          }
        });
      }
      function draftHasMathDelimiters(src) {
        return /\$\$|\\\[|\\\(|\$[^$\n]/.test(String(src || ""));
      }
      function paintDraftPreview() {
        var el = document.getElementById("answer-preview");
        if (!el) return;
        var src = String(state.draft || "");
        var trimmed = src.trim();
        el.classList.toggle("is-empty", !trimmed);

          return;
        }
        try {
          if (draftHasMathDelimiters(src)) {
            el.innerHTML = renderMathMarkdown(src);
            return;
          }
          el.setAttribute("data-tex", trimmed);
          if (window.katex) {
            try {
              window.katex.render(trimmed, el, { throwOnError: false, displayMode: true });
            } catch (e1) {
              el.innerHTML = '<div class="math-fallback">' + esc(trimmed) + "</div>";
            }
          } else {
            el.innerHTML = '<div class="math-fallback">' + esc(trimmed) + "</div>";
          }
        } catch (e) {
          el.innerHTML = '<div class="math-fallback">' + esc(trimmed) + "</div>";
        }
      }

      function bindSwipe() {
        if (!stageEl) return;
        var tracking = false, startX = 0, startY = 0, dx = 0, axis = null, pointerId = null, captured = false;

        function onDown(e) {
          if (e.button != null && e.button !== 0) return;
          if (e.target.closest("button, a, input, textarea, select, .page-nav, .page-dot, .composer, .tabbar, .rail")) return;
          tracking = true;
          pointerId = e.pointerId;
          startX = e.clientX; startY = e.clientY; dx = 0; axis = null; captured = false;
        }
        function onMove(e) {
          if (!tracking || e.pointerId !== pointerId) return;
          var mx = e.clientX - startX, my = e.clientY - startY;
          if (!axis) {
            if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
            axis = Math.abs(mx) > Math.abs(my) * 1.15 ? "x" : "y";
            if (axis === "x") {
              stageEl.classList.add("is-swiping");
              if (!captured) {
                try { stageEl.setPointerCapture(pointerId); captured = true; } catch (err) {}
              }
              e.preventDefault();
            }
          }
          if (axis !== "x") return;
          e.preventDefault();
          dx = mx;
          var sheet = root.querySelector(".flip-sheet.is-open");
          if (sheet && state.mode === "practice") {
            var t = Math.max(-1, Math.min(1, dx / 180));
            sheet.style.transform = "translateX(" + (t * 18) + "%) scale(" + (1 - Math.abs(t) * 0.015) + ")";
            sheet.style.opacity = String(1 - Math.abs(t) * 0.18);
            sheet.style.transition = "none";
          }
        }
        function onUp(e) {
          if (!tracking || (pointerId != null && e.pointerId !== pointerId)) return;
          tracking = false;
          stageEl.classList.remove("is-swiping");
          var sheet = root.querySelector(".flip-sheet");
          if (sheet) {
            sheet.style.transform = "";
            sheet.style.opacity = "";
            sheet.style.transition = "";
          }
          if (captured) {
            try { stageEl.releasePointerCapture(pointerId); } catch (err) {}
          }
          captured = false; pointerId = null;
          if (!flipBusy && axis === "x" && Math.abs(dx) >= SWIPE_THRESHOLD) {
            if (dx < 0) flipForward();
            else flipBack();
          }
          axis = null; dx = 0;
        }
        stageEl.addEventListener("pointerdown", onDown);
        stageEl.addEventListener("pointermove", onMove, { passive: false });
        stageEl.addEventListener("pointerup", onUp);
        stageEl.addEventListener("pointercancel", onUp);

        window.addEventListener("keydown", function (e) {
          if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
          if (state.mode !== "practice") return;
          if (e.key === "ArrowLeft") { e.preventDefault(); flipBack(); }
          else if (e.key === "ArrowRight") { e.preventDefault(); flipForward(); }
        });
      }

      function applyDeepLink(params, saved) {
        var learner = learnerFrom(params, saved);
        var itemId = params.get("item");
        var push = params.get("push");
        var viewHint = params.get("view");
        var modeHint = params.get("mode");
        state.learner = learner;
        if (!learner) {
          state.mode = "practice";
          setView("today", { push: null, fromDeepLink: false });
          return;
        }
        state.push = push;
        if (saved) {
          // Prefer server answered from bootstrap; local cache only fills gaps / offline.
          if (saved.answered) {
            if (!BOOT_READY) state.answered = saved.answered;
            else {
              Object.keys(saved.answered).forEach(function (id) {
                if (!state.answered[id]) state.answered[id] = saved.answered[id];
              });
            }
          }
          if (saved.threads) state.threads = saved.threads;
          if (saved.recents) state.recents = saved.recents;
          if (saved.railExpanded) state.railExpanded = saved.railExpanded;
          if (saved.contextItemId) state.contextItemId = saved.contextItemId;
          if (saved.headerCollapsed !== undefined) state.headerCollapsed = !!saved.headerCollapsed;
        }
        itemId = canonicalItemId(itemId);
        if (modeHint === "tutor") {
          state.mode = "tutor";
          if (itemId) state.contextItemId = itemId;
          seedRecents();
          render();
          return;
        }
        state.mode = "practice";
        if (viewHint === "done") { setView("done"); return; }
        if (viewHint === "invalid") { setView("invalid"); return; }
        if (viewHint === "today") { setView("today", { push: null, fromDeepLink: false }); return; }
        if (viewHint === "result") {
          var idxR = findItemIndex(itemId);
          if (idxR < 0) { setView("invalid"); return; }
          state.index = idxR;
          var cached = state.answered[ITEMS[idxR].id];
          setView("result", {
            result: cached || { correct: true, comment: ITEMS[idxR].commentOk, explain: ITEMS[idxR].explain, submitted: "（示例作答）" },
            fromDeepLink: !!push
          });
          return;
        }
        if (push || itemId) {
          if (!itemId) { setView("invalid"); return; }
          var idx = findItemIndex(itemId);
          if (idx < 0 || push === "expired" || push === "bad") { setView("invalid"); return; }
          setView("desk", { index: idx, resetDraft: true, fromDeepLink: true, push: push || "dingtalk" });
          return;
        }
        if (viewHint === "desk") { setView("desk", { resetDraft: true }); return; }
        if (saved && saved.view) {
          state.mode = saved.mode || "practice";
          state.index = typeof saved.index === "number" ? saved.index : 0;
          state.fromDeepLink = !!saved.fromDeepLink;
          state.push = saved.push || null;
          state.lastResult = saved.lastResult || null;
          if (saved.headerCollapsed !== undefined) state.headerCollapsed = !!saved.headerCollapsed;
          setView(saved.view);
          return;
        }
        setView("today");
      }

      document.querySelectorAll("[data-nav]").forEach(function (btn) {
        btn.addEventListener("click", function () { setMode(btn.getAttribute("data-nav")); });
      });
      headerEl.addEventListener("click", function (e) {
        var t = e.target.closest('[data-od-id="brand-toggle"]');
        if (t) toggleHeader();
      });
      document.getElementById("btn-rail-toggle").addEventListener("click", function () {
        state.railExpanded = !state.railExpanded;
        persist();
        syncChrome();
      });
      document.getElementById("composer-form").addEventListener("submit", function (e) {
        e.preventDefault();
        sendChat(composerInput.value);
      });
      composerInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat(composerInput.value);
        }
      });


      function boot() {
        var params = qs();
        var saved = restore();
        var learner = learnerFrom(params, saved);
        state.learner = learner;
        if (saved && typeof saved.railExpanded === "boolean") state.railExpanded = saved.railExpanded;
        else state.railExpanded = wideDesktop();
        if (!learner) {
          applyDeepLink(params, saved);
          if (typeof bindPageChrome === "function") bindPageChrome();
          if (typeof bindSwipe === "function") bindSwipe();
          if (typeof bindGestures === "function") bindGestures();
          return;
        }
        fetch(apiUrl("/api/v1/practice/bootstrap?learner=" + encodeURIComponent(learner)), {
          headers: apiHeaders()
        }).then(function (r) { return r.json(); }).then(function (data) {
          applyBootstrap(data);
          var itemQ = canonicalItemId(params.get("item"));
          var pushQ = params.get("push");
          var needFetch = !!(itemQ || pushQ) && findItemIndex(itemQ) < 0;
          var cont = function () {
            applyDeepLink(params, saved);
            if (typeof bindPageChrome === "function") bindPageChrome();
            if (typeof bindSwipe === "function") bindSwipe();
            if (typeof bindGestures === "function") bindGestures();
          };
          if (needFetch) ensureItemFromServer(itemQ, pushQ).then(cont);
          else cont();
        }).catch(function (e) {
          BOOT_ERROR = (e && e.message) || "network";
          applyDeepLink(params, saved);
          if (typeof bindPageChrome === "function") bindPageChrome();
          if (typeof bindSwipe === "function") bindSwipe();
          if (typeof bindGestures === "function") bindGestures();
          if (!ITEMS.length) {
            state.error = "无法连接练习 API（" + BOOT_ERROR + "）。请确认 practice_web 已启动。";
            setView("today");
          }
        });
      }
      boot();

      var mod = document.getElementById("module-switch");
      if (mod) {
        mod.addEventListener("change", function () {
          if (mod.value === "brain") setMode("brain");
          else if (state.mode === "brain") setMode("practice");
        });
      }
      window.addEventListener("message", function (ev) {
        if (ev && ev.data && ev.data.type === "cap-embed-exit") {
          if (mod) mod.value = "teaching";
          if (state.mode === "brain") setMode("practice");
        }
      });
    })();
  </script>
</body>
</html>
